[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-design-prototype"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pyproj>=3.7,<4",
    "shapely>=2.1,<3",
    "osmium>=3.7.0,<=4.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
