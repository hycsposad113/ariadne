  "metric_notes": {
    "gsi_zh": "GSI = 建築 footprint 面積 / 明確的參考面積。",
    "fsi_zh": "FSI = 納入樓層的總樓地板面積 / 同一參考面積。",
    "l_zh": "L = FSI / GSI 的平均樓層指標；空間範圍、地下層與樓層納入規則須明訂。",
    "osr_zh": "OSR = 非建築用地面積 / 總樓地板面積；若以 GSI、FSI 表示，可寫作 (1 - GSI) / FSI，惟分母與道路是否納入需一致。",
    "d_over_h_zh": "D/H 以 D 代表兩側建築面之淨距、H 代表街道兩側平均高度；它是常見 H/W 的倒數寫法，須記錄量測斷面。它不是日照或風性能的替代結果。",
    "svf_zh": "SVF 是觀測點可見天空半球的比例；近似值需用 3D 幾何／魚眼影像等方法並記錄演算法與輸入。字典未計算。",
    "ground_floor_aperture_zh": "地面層開口率 = 面向公共空間的門窗／可進入開口淨寬總和 / 該面臨街總長；需有立面與門窗資料。",
    "streetwall_continuity_zh": "臨街面連續率 = 建築臨街長度 / 街段可建臨邊長度；騎樓、退縮與架空層的計入方式須明訂。",
    "permeability_zh": "每公頃可通行公共連接數或街廓可穿越路徑數；只把確有公共通行權和開放時段的路徑列入。",
    "data_scope_zh": "僅 footprint 不足以計算樓層、SVF、地面開口、綠蔭、自然監視或實際使用；缺項須保留為未知，不以 0 代替。"
